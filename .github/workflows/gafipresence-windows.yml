name: GafiPresence Windows build

concurrency:
  group: gafipresence-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/workflows/gafipresence-windows.yml"
      - ".gitignore"
      - "README.md"
      - "main.cjs"
      - "preload.cjs"
      - "package.json"
      - "renderer/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: |
          node --check main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check renderer/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable application
        run: npm run build:win
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: GafiPresence-Windows-Portable
          path: dist/GafiPresence-*-Portable.exe
          if-no-files-found: error
